
###############################################################################
##################################   Vehicles   ###############################
###############################################################################

##Inherit for Horse units, makes the targetable as infantry.
^Horse:
	Mobile:
		TurnSpeed: 160
		Speed: 160
		Locomotor: wheeled
	Armor:
		Type: Light

^MediSiege:
	Mobile:
		TurnSpeed: 12
		Speed: 60
		Locomotor: heavywheeled
	Armor:
		Type: Light
	Power:
		Amount: 20

^Medibeast:
	Inherits: ^Vehicle
	Mobile:
		Speed: 100
		Locomotor: foot
	Power:
		Amount: 30
###############################################################################
###################################   MCV   ###################################
###############################################################################

##main construction vehicle
##mcvm
MCVM:
	Inherits: MCV
	Inherits@GLAVehicle: ^GLAVehicle
	Inherits@selection: ^SelectableSupportUnit
	Buildable:
		Prerequisites: fix, ~mcv, ~techlevel.medium, ~vehicles.medi
	Transforms:
		IntoActor: mediconyard
	RenderSprites:
		Image: mcvmedi

###############################################################################
##############################   Utility and Misc   ###########################
###############################################################################

##Sends Money to others
TRUKMedi:
	Inherits: ^TrackedVehicle
	Inherits@move: ^Horse
	Inherits@selection: ^SelectableSupportUnit
	Buildable:
		IconPalette: tsunit
		Queue: Vehicle
		BuildPaletteOrder: 410
		Prerequisites: ~vehicles.medi, techcenter
		Description: Transports cash to other players.\n  Unarmed
	Valued:
		Cost: 500
	WithMoveAnimation:
		MoveSequence: run
	Tooltip:
		Name: Supply Truck
	Health:
		HP: 11000
	Armor:
		Type: Light
	Mobile:
		Speed: 130
	RevealsShroud:
		Range: 4c0
	DeliversCash:
		Payload: 500
		PlayerExperience: 50
	SpawnActorOnDeath:
		Actor: moneycrate
	Selectable:
		Bounds: 1280, 1280
		DecorationBounds: 1280, 1280
	RenderSprites:
		Image: medicarriage

