	Inherits: rockgolem
	GrantConditionOnHealth@BrokenGolem:
		Condition: BrokenGolem
		MaxHP: 20000
		GrantPermanently: True
	ChangesHealth@GolemBreak:
		PercentageStep: 50
		Delay: 500
		DamageCooldown: 500
		StartIfBelow: 100
