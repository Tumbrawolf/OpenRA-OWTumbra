##short range spread shot, Fires explosive magic against vehicles
##catapult
catapult:
	Inherits: ^TrackedVehicle
	Inherits@Msiege: ^MediSiege
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		Prerequisites: ~vehicles.medi
		BuildPaletteOrder: 401
		BuildDuration: 400
		Description: medium ranged artillery.\n  Strong vs Infantry, Buildings\n  Weak vs Vehicles, Aircraft
	Valued:
		Cost: 400
	Tooltip:
		Name: Catapult
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 15000
	WithMoveAnimation:
		MoveSequence: run
	AutoTarget:
		InitialStance: Defend
		ScanRadius: 10
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Armament:
		Weapon: catapult
		LocalOffset: 624,0,208
	Armament@1:
		Name: primary1
		Weapon: catapult
		LocalOffset: 624,0,208
	Armament@2:
		Name: primary2
		Weapon: catapult
		LocalOffset: 624,0,208
	Armament@3:
		Name: primary3
		Weapon: catapult
		LocalOffset: 624,0,208
	Armament@4:
		Name: primary4
		Weapon: catapult
		LocalOffset: 624,0,208
	WithAttackAnimation:
		Sequence: shoot
	WithDeathAnimation:
		DeathSequence: die
	AttackFrontal:
		Armaments: primary , primary1 , primary2 , primary3 , primary4
		TargetFrozenActors: True
		FacingTolerance: 0
	ProducibleWithLevel:
		Prerequisites: vehicles.upgraded
	RenderSprites:
		Image: catapult
	Voiced:
