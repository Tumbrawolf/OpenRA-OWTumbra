^GamblingCode:
	KillsSelf@gamba:
		RemoveInstead: true
		Delay: 500
	-UpdatesPlayerStatistics:
	GrantRandomCondition@Gamba:
		Conditions: Jackpot, Big1, Big2, Big3, Big4, Big5, Big6, Big7, Big8, Big9, Big10, Big11, Big12, Big13, Big14, Big15, Mid1, Mid2, Mid3, Mid4, Mid5, Mid6, Mid7, Mid8, Mid9, Mid10, Mid11, Mid12, Mid13, Mid14, Mid15, Small1, Small2, Small3, Small4, Small5, Small6, Small7, Small8, Small9, Small10, Small11, Small12, Small13, Small14, Small15
