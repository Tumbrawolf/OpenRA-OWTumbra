		Actor: SLAVE
		SpawnOffset: 1,2
		RequiresCondition: !build-incomplete && !mediabolish
	FreeActor@1:
		Actor: SLAVE
		SpawnOffset: 1,2
		RequiresCondition: !build-incomplete && !mediabolish
	FreeActor@3:
		Actor: MEDIWORKER
		SpawnOffset: 1,2
		RequiresCondition: mediabolish
	GrantConditionOnPrerequisite@mediabolish:
		Condition: mediabolish
		Prerequisites: ~!upgrade.mediabolish
	RenderSprites:
		Image: slavecampgc
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 5
		FullSequence: pip-yellow
	ProvidesPrerequisite@medi:
