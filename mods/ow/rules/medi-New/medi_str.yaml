##Main MCV Building
mediconyard:
	Inherits@prereqs: ^ConYardPrereqs
	Inherits@con: ^ConYard
	Inherits@BIB: ^3xBuildingBib
	Valued:
		Cost: 2000
	Tooltip:
		Name: Mediaval conyard
	BaseBuilding:
	Transforms:
		RequiresCondition: factundeploy && !bot_undeploy_block
		PauseOnCondition: chrono-vortex || being-captured || being-demolished || build-incomplete
		IntoActor: MCVM
	TransformsIntoMobile:
		RequiresCondition: factundeploy && !bot_undeploy_block
		Locomotor: heavywheeled
		RequiresForceMove: true
	TransformsIntoPassenger:
		RequiresCondition: factundeploy && !bot_undeploy_block
		CargoType: Vehicle
		RequiresForceMove: true
	TransformsIntoRepairable:
		RequiresCondition: factundeploy && !bot_undeploy_block
		RepairActors: fix
		RequiresForceMove: true
	TransformsIntoTransforms:
		RequiresCondition: factundeploy && build-incomplete && !bot_undeploy_block
	Sellable:
		RequiresCondition: !build-incomplete && !chrono-vortex && !being-captured && !being-demolished
	Power:
		Amount: 0
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@medi:
		Prerequisite: structures.medi
	RenderSprites:
		Image: factm

##No Power Foundry
##foundrymed
foundrymedi:
	Inherits: FOUNDRY
	Inherits@tax: ^TaxableLow
	Valued:
		Cost: 2000
	Buildable:
		Queue: Tech
		BuildPaletteOrder: 25
		Prerequisites: conyard, ~techlevel.medium, ~structures.medi, ~!structures.bothard
		Description: Autonomous building construction. \nIncreases build speed of Structures and\nDefense by 1 stage (max 10).
	Power:
		Amount: 0
	RenderSprites:
		Image: foundry

##Medi Version of Servayor outpost
##outpostmed
outpostmedi:
	Inherits@tax: ^TaxableLow
