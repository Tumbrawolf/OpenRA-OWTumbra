
###############################################################################
##################################   Buildings   ##############################
###############################################################################

TaxableBase:
	ExternalCondition@TaxMan:
		Condition: TaxMan
	Targetable@Tax:
		TargetTypes: Taxable
		RequiresCondition: !TaxMan

^TaxableLow:
	Inherits@tax: TaxableBase
	CashTrickler:
		Interval: 1000
		InitialDelay: 0
		Amount: 300
		RequiresCondition: TaxMan

^TaxableMid:
	Inherits@tax: TaxableBase
	CashTrickler:
		Interval: 1000
		InitialDelay: 0
		Amount: 700
		RequiresCondition: TaxMan

^TaxableHigh:
	Inherits@tax: TaxableBase
	CashTrickler:
		Interval: 1000
		InitialDelay: 0
		Amount: 1500
		RequiresCondition: TaxMan

^TaxableSuper:
	Inherits@tax: TaxableBase
	CashTrickler:
		Interval: 1000
		InitialDelay: 0
		Amount: 2000
		RequiresCondition: TaxMan


