##starting harvester
##medislave
mediSLAVE:
	Inherits: GHARV
	-SpeedMultiplier@shoes:
	Buildable:
		IconPalette: tsunit
		Queue: Infantry
		BuildAtProductionType: Soldier
		Prerequisites: ~infantry.medi, ~!upgrade.mediabolish, ~!infantry.medicult
		Description: Collects Ore, Tiberium and Gems for processing.\nCan repair buildngs and vehicles.
		BuildPaletteOrder: 403
		BuildDuration: 400
	Valued:
		Cost: 50
	Tooltip:
		Name: Slave
	Mobile:
		Speed: 40
		Locomotor: foot
	Health:
		HP: 3000
	Harvester:
		Capacity: 10
	Voiced:
		VoiceSet: SlaveVoice
	Armament:
		Weapon: RepairWorker
		Cursor: repair
		OutsideRangeCursor: repair
		TargetRelationships: Ally
		ForceTargetRelationships: None
	TakeCover:
		SpeedModifier: 140
		Duration: 75
		DamageTriggers: TriggerProne
	ChangesHealth@tiberium:
