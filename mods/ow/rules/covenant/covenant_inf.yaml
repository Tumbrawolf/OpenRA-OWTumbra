covenantgrunt:
	Inherits: ^Soldier
	Inherits: ^AcceptsShields
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Soldier
		BuildPaletteOrder: 4
		Prerequisites: ~infantry.covenant
		Description: actor-covenantgrunt.description
	Tooltip:
		Name: actor-covenantgrunt.name
	Valued:
		Cost: 100
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 10000
	Mobile:
		Voice: Move
		Speed: 70
	Guard:
		Voice: Move
	Passenger:
		Voice: Move
	GrantRandomPeriodicCondition@normal:
		Conditions: fake, needler
		CooldownDuration: 1
		ActiveDuration: 90000
		PauseOnCondition: armament
	GrantRandomPeriodicCondition@armament:
		Conditions: fake, needler, fuelrod, plasmalauncher
		CooldownDuration: 1
		ActiveDuration: 90000
		RequiresCondition: armament
	Armament@plasmagrenade:
		Weapon: covenantplasmagrenade
		LocalOffset: 0,0,250
		PauseOnCondition: fuelrod || plasmalauncher
	Armament@PRIMARY:
		Weapon: covenantplasmapistol
		PauseOnCondition: needler || fuelrod || plasmalauncher
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: covenantplasmapistol
		MuzzleSequence: garrison-muzzle
		PauseOnCondition:  needler || fuelrod || plasmalauncher
	Armament@BUS:
		Name: bus
		Weapon: covenantplasmapistol
		MuzzleSequence: garrison-muzzle
		PauseOnCondition:  needler || fuelrod || plasmalauncher
	Armament@PRIMARYneedler:
		Weapon: covenantneedler
		LocalOffset: 0,0,250
		RequiresCondition: needler
	Armament@GARRISONEDneedler:
		Name: garrisoned
		Weapon: covenantneedler
		MuzzleSequence: garrison-muzzle
		RequiresCondition: needler
	Armament@BUSneedler:
		Name: bus
		Weapon: covenantneedler
		RequiresCondition: needler
	Armament@PRIMARYfuelrod:
		Weapon: covenantfuelrodcannon
		LocalOffset: 0,0,250
		RequiresCondition: fuelrod
	Armament@GARRISONEDfuelrod:
		Name: garrisoned
		Weapon: covenantfuelrodcannon
		MuzzleSequence: garrison-muzzle
		RequiresCondition: fuelrod
	Armament@BUSfuelrod:
		Name: bus
		Weapon: covenantfuelrodcannon
		RequiresCondition: fuelrod
	Armament@PRIMARYplasmalauncher:
		Weapon: covenantplasmalauncher
		LocalOffset: 0,0,250
		RequiresCondition: plasmalauncher
	Armament@PRIMARYplasmalauncherAA:
		Weapon: covenantplasmalauncherAA
		LocalOffset: 0,0,250
		RequiresCondition: plasmalauncher
	Armament@GARRISONEDplasmalauncher:
		Name: garrisoned
		Weapon: covenantplasmalauncher
		MuzzleSequence: garrison-muzzle
		RequiresCondition: plasmalauncher
	Armament@BUSplasmalauncher:
		Name: bus
		Weapon: covenantplasmalauncher
		RequiresCondition: plasmalauncher
	WithInfantryBody:
		DefaultAttackSequence: shoot
		RequiresCondition: !parachute
	WithInfantryBody@PARACHUTE:
		StandSequences: parachute
		RequiresCondition: parachute
	ProducibleWithLevel:
		Prerequisites: barracks.upgraded
	RevealsShroud:
		Range: 5c0
	Selectable:
		Bounds: 768, 853, 0, -256
		DecorationBounds: 640, 896, 0, -426
	RenderSprites:
		Image: usaranger 
	Voiced:
		VoiceSet: CovenantGrunt
	AnnounceOnKill:
		Interval: 50000
	GrantConditionOnPrerequisite@armament:
		Condition: armament
		Prerequisites: covenant.armament

covenantelite:
	Inherits: ^Soldier
	Inherits: ^AcceptsShields
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Soldier
		BuildPaletteOrder: 5
		Prerequisites: ~infantry.covenant
		Description: actor-covenantelite.description
	Tooltip:
		Name: actor-covenantelite.name
	Valued:
		Cost: 300
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 18000
	Shielded:
		MaxStrength: 25000
		RequiresCondition: !emp_shields && !defense_matrix
		HideBarWhenFull: false
	Mobile:
		Voice: Move
		Speed: 70
	Guard:
		Voice: Move
	Passenger:
		Voice: Move
	GrantRandomPeriodicCondition@normal:
		Conditions: fake, needler, plasmalauncher, energysword, carbine
		CooldownDuration: 1
		ActiveDuration: 90000
	Armament@PRIMARY:
		Weapon: covenantplasmarifle
		LocalOffset: 0,0,250
		PauseOnCondition: needler || plasmalauncher || energysword || carbine
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: covenantplasmarifle
		MuzzleSequence: garrison-muzzle
		PauseOnCondition: needler || plasmalauncher || energysword || carbine
	Armament@BUS:
		Name: bus
		Weapon: covenantplasmarifle
		PauseOnCondition: needler || plasmalauncher || energysword || carbine
	Armament@PRIMARYneedler:
		Weapon: covenantneedler
		LocalOffset: 0,0,250
		RequiresCondition: needler
	Armament@GARRISONEDneedler:
		Name: garrisoned
		Weapon: covenantneedler
		MuzzleSequence: garrison-muzzle
		RequiresCondition: needler
	Armament@BUSneedler:
		Name: bus
		Weapon: covenantneedler
		RequiresCondition: needler
	Armament@PRIMARYplasmalauncher:
		Weapon: covenantplasmalauncher
		LocalOffset: 0,0,250
		RequiresCondition: plasmalauncher
	Armament@PRIMARYplasmalauncherAA:
		Weapon: covenantplasmalauncherAA
		LocalOffset: 0,0,250
		RequiresCondition: plasmalauncher
	Armament@GARRISONEDplasmalauncher:
		Name: garrisoned
		Weapon: covenantplasmalauncher
		MuzzleSequence: garrison-muzzle
		RequiresCondition: plasmalauncher
	Armament@BUSplasmalauncher:
		Name: bus
		Weapon: covenantplasmalauncher
		RequiresCondition: plasmalauncher
	Armament@PRIMARYEnergySword:
		Weapon: masterchiefenergysword
		ReloadingCondition: attack-cooldown
		RequiresCondition: energysword
	AttackLeap:
		Voice: Attack
		PauseOnCondition: attack-cooldown
		RequiresCondition: energysword
	AmbientSound@EnergySword:
		SoundFiles: masterchiefenergyswordloop.aud
		RequiresCondition: energysword
		Interval: 175
	DamageMultiplier@EnergySword:
		Modifier: 75
		RequiresCondition: energysword
	SpeedMultiplier@EnergySword:
		Modifier: 140
		RequiresCondition: energysword
	Armament@PRIMARYcarbine:
		Weapon: covenantplasmacarbine
		LocalOffset: 0,0,250
		RequiresCondition: carbine
	Armament@GARRISONEDcarbine:
		Name: garrisoned
		Weapon: covenantplasmacarbine
		MuzzleSequence: garrison-muzzle
		RequiresCondition: carbine
	Armament@BUScarbine:
		Name: bus
		Weapon: covenantplasmacarbine
		RequiresCondition: carbine
	WithInfantryBody:
		DefaultAttackSequence: shoot
		RequiresCondition: !parachute
	WithInfantryBody@PARACHUTE:
		StandSequences: parachute
		RequiresCondition: parachute
	ProducibleWithLevel:
		Prerequisites: barracks.upgraded
	RevealsShroud:
		Range: 5c0
	Selectable:
		Bounds: 768, 853, 0, -256
		DecorationBounds: 640, 896, 0, -426
	RenderSprites:
		Image: japanimperialwarrior
	Voiced:
		VoiceSet: CovenantElite
	AmbientSound:
		SoundFiles: covenanteliteidle1.ogg, covenanteliteidle2.ogg
		Interval: 3500, 9000
		Delay: 1500, 9000
	AnnounceOnKill:
		Interval: 50000

