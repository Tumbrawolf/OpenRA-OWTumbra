# Infantry speed 30%
avalon.infspeed:
	Inherits: ^UpgradeBaseExt
	Tooltip:
		Name: actor-avalon-infspeed.name
	Buildable:
		Description: actor-avalon-infspeed.description
		BuildPaletteOrder: 10200
		Prerequisites: !infantry.speed2, ~structures.avalon, barracks, ~techlevel.medium
	ProvidesPrerequisite@upgradename:
	ProvidesPrerequisite@speed1:
		Prerequisite: infantry.speed1
	ProvidesPrerequisite@speed2:
		Prerequisite: infantry.speed2
	ProductionCostMultiplier@upgrade:
		Multiplier: 5000
	RenderSprites:
		Image: avalon.infspeed
	WithProductionIconOverlay:
		Types: UpgradeComplete
		Prerequisites: infantry.speed2

